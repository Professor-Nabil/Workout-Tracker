<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Create New Workout Plan</title>
    <script defer src="/storage.service.js"></script>
    <script defer src="/plans/create/create.js"></script>
    <script defer src="/alpine.min.js"></script>
  </head>
  <body x-data="alpineData">
    <nav>
      <a href="/">Home</a>
    </nav>
    <hr />

    <h3>Create Dynamic Workout Plan</h3>
    <hr />

    <form @submit.prevent="createPlan()">
      <input x-model="reqBody.title" type="text" placeholder="Plan Title" />

      <h4>Exercises list</h4>

      <div>
        <template x-for="(elm, index) in reqBody.planExercises" :key="index">
          <div>
            <hr />
            <select x-model="elm.exerciseId">
              <option value="" disabled selected>-- Choose Exercise --</option>
              <template x-for="ex in exerciseListData" :key="ex.id">
                <option :value="ex.id" x-text="ex.name"></option>
              </template>
            </select>

            <label>
              Weight (kg):
              <input x-model="elm.weight" type="text" style="width: 60px" />
            </label>

            <label>
              Sets:
              <input x-model="elm.sets" type="text" style="width: 50px" />
            </label>

            <label>
              Reps:
              <input x-model="elm.reps" type="text" style="width: 50px" />
            </label>

            <button @click="removeExerciseElement(index)">Remove</button>
            <hr />
          </div>
        </template>
      </div>

      <br />
      <button type="button" @click="addExerciseElement()">
        Add Exercise Field
      </button>

      <br /><br />
      <hr />

      <button type="submit">Finalize & Save Plan</button>
    </form>

    <br />
    <button @click="printReqBody()">Console log</button>
  </body>
</html>
