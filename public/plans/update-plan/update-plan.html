<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Update Workout Plans</title>
    <script defer src="/storage.service.js"></script>
    <script defer src="/plans/update-plan/update-plan.js"></script>
    <script defer src="/alpine.min.js"></script>
  </head>
  <body x-data="alpineData">
    <nav>
      <a href="/">Home</a>
    </nav>
    <hr />

    <h3>Update Workout Plans</h3>
    <hr />

    <div style="display: flex; flex-direction: column; gap: 20px">
      <template x-for="(plan, planIndex) in plans" :key="plan.id">
        <div
          style="
            border: 1px solid #ccc;
            padding: 15px;
            border-radius: 6px;
            background-color: #fafafa;
          "
        >
          <template x-if="editingPlanId === plan.id">
            <div style="margin-bottom: 10px">
              <label
                ><b>Edit Plan Title:</b>
                <input
                  type="text"
                  x-model="editForm.title"
                  style="font-size: 1.1em; width: 300px"
                />
              </label>
            </div>
          </template>
          <template x-if="editingPlanId !== plan.id">
            <h4 style="margin: 0 0 5px 0; color: #333" x-text="plan.title"></h4>
          </template>

          <small
            style="color: #666; font-family: monospace"
            x-text="'Plan UUID: ' + plan.id"
          ></small>

          <h5 style="margin: 15px 0 5px 0">Exercises included:</h5>

          <table
            border="1"
            cellpadding="6"
            style="border-collapse: collapse; background: white; width: 100%"
          >
            <thead>
              <tr style="background: #f0f0f0">
                <th>Exercise Name</th>
                <th>Category</th>
                <th>Target Tool</th>
                <th>Weight Load</th>
                <th>Target Sets</th>
                <th>Target Reps</th>
                <th>Target Period</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="(ex, exIndex) in plan.planExercise" :key="ex.id">
                <tr>
                  <td
                    x-text="ex.exercise ? ex.exercise.name : 'Unknown Exercise'"
                    style="font-weight: bold; color: #222"
                  ></td>
                  <td
                    x-text="ex.exercise && ex.exercise.category ? ex.exercise.category.name : 'N/A'"
                    style="color: #333"
                  ></td>
                  <td
                    x-text="ex.exercise && ex.exercise.tool ? ex.exercise.tool.name : 'None'"
                    style="color: #555; font-style: italic"
                  ></td>

                  <template x-if="editingPlanId === plan.id">
                    <td style="background: #fff9e6">
                      <input
                        type="number"
                        x-model.number="editForm.planExercises[exIndex].weight"
                        style="width: 60px"
                        placeholder="null"
                      />
                      kg
                    </td>
                  </template>
                  <template x-if="editingPlanId !== plan.id">
                    <td
                      x-text="(ex.weight === null || ex.weight === undefined) ? 'None' : ex.weight + ' kg'"
                    ></td>
                  </template>

                  <template x-if="editingPlanId === plan.id">
                    <td style="background: #fff9e6">
                      <input
                        type="number"
                        x-model.number="editForm.planExercises[exIndex].sets"
                        style="width: 50px"
                      />
                    </td>
                  </template>
                  <template x-if="editingPlanId !== plan.id">
                    <td x-text="ex.sets"></td>
                  </template>

                  <template x-if="editingPlanId === plan.id">
                    <td style="background: #fff9e6">
                      <input
                        type="number"
                        x-model.number="editForm.planExercises[exIndex].reps"
                        style="width: 50px"
                      />
                    </td>
                  </template>
                  <template x-if="editingPlanId !== plan.id">
                    <td x-text="ex.reps"></td>
                  </template>

                  <template x-if="editingPlanId === plan.id">
                    <td style="background: #fff9e6">
                      <input
                        type="number"
                        x-model.number="editForm.planExercises[exIndex].period"
                        style="width: 50px"
                        placeholder="null"
                      />
                    </td>
                  </template>
                  <template x-if="editingPlanId !== plan.id">
                    <td x-text="ex.period || '-'"></td>
                  </template>
                </tr>
              </template>
            </tbody>
          </table>

          <div style="margin-top: 15px">
            <template x-if="editingPlanId !== plan.id">
              <button @click="startEditing(plan)">✏️ Edit This Plan</button>
            </template>

            <template x-if="editingPlanId === plan.id">
              <div>
                <button
                  @click="submitPlanUpdate()"
                  style="background: green; color: white; font-weight: bold"
                >
                  💾 Save Changes
                </button>
                <button
                  @click="cancelEditing()"
                  style="background: #777; color: white"
                >
                  Cancel
                </button>
              </div>
            </template>
          </div>
        </div>
      </template>
    </div>

    <template x-if="plans.length === 0">
      <p>No plans found. Go create a plan to start viewing it here!</p>
    </template>
  </body>
</html>
