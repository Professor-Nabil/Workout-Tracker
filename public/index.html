<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Workout Tracker - Gateway</title>
    <!-- <script src="https://cdn.tailwindcss.com"></script> -->
    <script src="/tailwind.min.js"></script>
    <script defer src="/storage.service.js"></script>
    <script defer src="/auth.js"></script>
    <script defer src="/alpine.min.js"></script>
  </head>
  <body
    x-data="authGateway"
    class="bg-gray-50 font-sans max-w-md mx-auto my-10 p-6 border border-gray-200 rounded-lg shadow-sm"
  >
    <div class="flex gap-2.5 mb-5">
      <button
        @click="isLoginTab = true"
        :class="isLoginTab ? 'font-bold bg-blue-600 text-white px-4 py-2 rounded border border-transparent' : 'px-4 py-2 border border-gray-300 rounded text-gray-700 bg-white hover:bg-gray-50 cursor-pointer'"
      >
        Login
      </button>
      <button
        @click="isLoginTab = false"
        :class="!isLoginTab ? 'font-bold bg-blue-600 text-white px-4 py-2 rounded border border-transparent' : 'px-4 py-2 border border-gray-300 rounded text-gray-700 bg-white hover:bg-gray-50 cursor-pointer'"
      >
        Create Account
      </button>
    </div>

    <template x-if="banner.text">
      <div
        :class="'p-3 mb-4 rounded text-white ' + (banner.isError ? 'bg-red-600' : 'bg-green-600')"
        x-text="banner.text"
      ></div>
    </template>

    <form @submit.prevent="handleSubmit()">
      <h3
        class="text-xl font-bold text-gray-800 mb-4"
        x-text="isLoginTab ? 'Welcome Back' : 'Register New Account'"
      ></h3>

      <div class="mb-3">
        <label class="block text-sm font-medium text-gray-700 mb-1"
          >Email Address:</label
        >
        <input
          type="email"
          x-model="formData.email"
          required
          class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"
        />
      </div>

      <div class="mb-5">
        <label class="block text-sm font-medium text-gray-700 mb-1"
          >Password:</label
        >
        <input
          type="password"
          x-model="formData.password"
          required
          class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"
        />
      </div>

      <button
        type="submit"
        class="w-full p-2.5 bg-green-600 hover:bg-green-700 text-white font-semibold rounded-md shadow text-base transition-colors duration-200 cursor-pointer"
        x-text="isLoginTab ? 'Sign In' : 'Sign Up'"
      ></button>
    </form>
  </body>
</html>
